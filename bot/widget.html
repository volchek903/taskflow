<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--tg-theme-bg-color);color:var(--tg-theme-text-color);font-family:system-ui,sans-serif}.shell{padding:18px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand{font-size:12px;font-weight:800;letter-spacing:2.5px}.section{color:var(--tg-theme-hint-color);font-size:12px}.title{font-size:22px;font-weight:760;margin:0 0 5px}.sub{color:var(--tg-theme-hint-color);font-size:12px}.progress{height:5px;background:var(--tg-theme-secondary-bg-color);border-radius:9px;margin:14px 0 8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--tg-theme-button-color);border-radius:9px}.list{margin-top:13px}.item{display:flex;align-items:center;gap:11px;min-height:44px;padding:9px 0;border-top:1px solid var(--tg-theme-section-separator-color)}.marker{display:grid;place-items:center;width:22px;height:22px;flex:none;border:1.5px solid var(--tg-theme-hint-color);border-radius:6px;font-size:12px}.marker.done{background:var(--tg-theme-button-color);border-color:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}.content{flex:1;min-width:0}.name{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name.done{text-decoration:line-through;color:var(--tg-theme-hint-color)}.meta{display:block;margin-top:3px;color:var(--tg-theme-hint-color);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.value{flex:none;color:var(--tg-theme-hint-color);font-size:11px}.avatars{display:flex;padding-left:6px}.avatar{display:grid;place-items:center;width:25px;height:25px;margin-left:-6px;border:2px solid var(--tg-theme-bg-color);border-radius:50%;background:var(--tg-theme-secondary-bg-color);font-size:9px;font-weight:800}.empty,.hint{margin-top:13px;padding:10px 12px;border-radius:9px;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-subtitle-text-color);font-size:12px;text-align:center}.hint{margin-top:10px}
</style>
</head>
<body><div class="shell"><div class="top"><span class="brand">TASKFLOW</span><span class="section">{{SECTION}}</span></div><div class="title">{{TITLE}}</div><div class="sub">{{SUBTITLE}}</div>{{EXTRA}}<div class="list">{{BODY}}</div><div class="hint">Актуальные данные · управление в Mini App</div></div><script>TelegramWidget.ready();</script></body>
</html>
